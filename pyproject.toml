[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photomancer"
description = "PhotoMancer: tag a photo archive with a local vision model (LM Studio) into XMP sidecars"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Matteo Marchionni" }]
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "Pillow>=10.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "scikit-image>=0.21",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "requests>=2.28",
    "psutil>=5.9",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Environment :: X11 Applications",
    "Topic :: Multimedia :: Graphics",
]

[project.optional-dependencies]
test = ["pytest>=7"]
build = ["pyinstaller>=6.5"]

[project.scripts]
photomancer = "photomancer.cli:main"

[project.gui-scripts]
photomancer-gui = "photomancer.gui:main"

[tool.setuptools.dynamic]
version = { attr = "photomancer.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
photomancer = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
